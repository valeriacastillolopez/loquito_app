name: loquito
description: >
  Maqueta visual (solo interfaz, sin funcionalidad) del teléfono de
  "El loquito" para el videojuego, incluyendo la app ficticia CatTube.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  video_player: ^2.9.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true