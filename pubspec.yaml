  name: loquito
  description: >
    Maqueta visual del teléfono de
    "El loquito" para el videojuego, incluyendo la app CatTube.
  publish_to: "none"
  version: 0.1.0

  environment:
    sdk: ">=3.0.0 <4.0.0"

  dependencies:
    flutter:
      sdk: flutter
    google_fonts: ^6.2.1
    http: ^1.2.2
    video_player: ^2.9.2
    cupertino_icons: ^1.0.6

  dev_dependencies:
    flutter_lints: ^4.0.0
    flutter_launcher_icons: ^0.14.4
    flutter_native_splash: ^2.4.6

  flutter:
    uses-material-design: true

    assets:
      - assets/images/

  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/app_icon.png"
    remove_alpha_ios: true

  flutter_native_splash:
    color: "#000000"
    image: assets/images/app_icon.png
    android: true
    ios: true